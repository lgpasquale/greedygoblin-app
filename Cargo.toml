[package]
name = "greedygoblin-app"
version = "0.1.0"
edition = "2024"

[dependencies]
auto-launch = "0.6.0"
base64 = "0.23.1"
chrono = { version = "0.4.45", default-features = false, features = ["clock", "std"] }
dirs = "7.0.0"
flate2 = "1.1.11"
image = { version = "0.25.10", default-features = false, features = ["png"] }
notify-rust = "4.18.2"
rfd = "0.17.2"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tao = "0.37.2"
toml = "1.2.1"
tray-icon = "0.26.1"
ureq = { version = "3.5.1", features = ["json"] }

[target."cfg(windows)".dependencies]
self-replace = "1.5.1"

[build-dependencies]
winresource = "0.1.34"
